<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="balloonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="6"/>
  <!-- Hot Air Balloon Silhouette (CorelDRAW Style) -->
  <g filter="url(#glow)">
    <path d="M256 60 C160 60 90 135 90 230 C90 305 160 370 230 405 L230 435 L282 435 L282 405 C352 370 422 305 422 230 C422 135 352 60 256 60 Z" fill="url(#balloonGrad)"/>
    <!-- Balloon Stripe Curves -->
    <path d="M256 60 C210 110 180 230 230 405 C242 405 250 405 256 405 C262 405 270 405 282 405 C332 230 302 110 256 60 Z" fill="#ffffff" opacity="0.3"/>
    <path d="M256 60 C235 120 220 220 245 405 L267 405 C292 220 277 120 256 60 Z" fill="url(#accentGrad)" opacity="0.9"/>
    <!-- Basket -->
    <rect x="235" y="445" width="42" height="30" rx="6" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
    <!-- Ropes -->
    <line x1="230" y1="435" x2="238" y2="445" stroke="#ffffff" stroke-width="3"/>
    <line x1="282" y1="435" x2="274" y2="445" stroke="#ffffff" stroke-width="3"/>
  </g>
  <!-- Vector Bézier Nodes and Handles -->
  <g stroke="#38bdf8" stroke-width="4">
    <line x1="160" y1="180" x2="256" y2="180" stroke-dasharray="6,6"/>
    <line x1="256" y1="180" x2="352" y2="180" stroke-dasharray="6,6"/>
  </g>
  <rect x="150" y="170" width="20" height="20" fill="#38bdf8" rx="3"/>
  <rect x="246" y="170" width="20" height="20" fill="#ffffff" rx="3" stroke="#38bdf8" stroke-width="3"/>
  <rect x="342" y="170" width="20" height="20" fill="#38bdf8" rx="3"/>
  <!-- Pen Tool Icon Overlay -->
  <path d="M380 340 L450 410 L430 450 L390 430 L340 380 Z" fill="#06b6d4" stroke="#ffffff" stroke-width="4"/>
  <circle cx="390" cy="380" r="5" fill="#ffffff"/>
</svg>
